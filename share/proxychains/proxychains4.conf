# proxychains.conf  VER 3.1
#
#        HTTP, SOCKS4, SOCKS5 tunneling proxifier with DNS.
#
# Bundled reference config for QProxy (share/proxychains/).
# - Live system file: /etc/proxychains4.conf
# - QProxy rewrites this via: sudo qproxy → Configure Proxychains
# - Proxy host/port source: ~/.qproxy.env (HTTP_HOST, HTTP_PORT, SOCKS5_HOST, SOCKS5_PORT)
# - Generated variants: templates/proxychains-*.conf
# - Full guide: docs/proxychains-config-guide.md

dynamic_chain

proxy_dns

tcp_read_time_out 10000
tcp_connect_time_out 5000

[ProxyList]
# Replace placeholders or run: sudo qproxy → Configure Proxychains
http 	10.X.X.X 3128
socks5 	10.X.X.X 1080
