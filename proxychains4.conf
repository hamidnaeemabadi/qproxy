# proxychains.conf  VER 3.1
#
#        HTTP, SOCKS4, SOCKS5 tunneling proxifier with DNS.
#	

# The option below identifies how the ProxyList is treated.
# only one option should be uncommented at time,
# otherwise the last appearing option will be accepted
#
dynamic_chain
#
# Dynamic - Each connection will be done via chained proxies
# all proxies chained in the order as they appear in the list
# at least one proxy must be online to play in chain
# (dead proxies are skipped)
# otherwise EINTR is returned to the app
# RECOMMENDED: Better reliability and performance
#
#strict_chain
#
# Strict - Each connection will be done via chained proxies
# all proxies chained in the order as they appear in the list
# all proxies must be online to play in chain
# otherwise EINTR is returned to the app
# NOTE: Can cause connection failures if any proxy is down
#
#random_chain
#
# Random - Each connection will be done via random proxy
# (or proxy chain, see  chain_len) from the list.
# this option is good to test your IDS :)
# NOTE: Good for anonymity but unpredictable performance

# Make sense only if random_chain
#chain_len = 2

# Quiet mode (no output from library)
#quiet_mode
# RECOMMENDED: Keep enabled for cleaner output in production

# Proxy DNS requests - no leak for DNS data
proxy_dns 
# CRITICAL: Prevents DNS leaks, always keep enabled

# Some timeouts in milliseconds (optimized for performance)
tcp_read_time_out 10000
tcp_connect_time_out 5000
# OPTIMIZED: Reduced timeouts for better performance
# - Read timeout: 10s (was 15s) - faster failure detection
# - Connect timeout: 5s (was 8s) - quicker connection attempts

# ProxyList format
#       type  host  port [user pass]
#       (values separated by 'tab' or 'blank')
#
#
#        Examples:
#
#            	socks5	192.168.67.78	1080	lamer	secret
#		http	192.168.89.3	8080	justu	hidden
#	 	socks4	192.168.1.49	1080
#	        http	192.168.39.93	8080	
#		
#
#       proxy types: http, socks4, socks5
#        ( auth types supported: "basic"-http  "user/pass"-socks )
#
[ProxyList]
# add proxy here ...
# meanwile
# defaults set to "tor"
# socks4 	127.0.0.1 9050

# OPTIMIZED PROXY CONFIGURATION
# Order matters: Fastest/most reliable proxies first
# Format: type host port [user pass]

# Primary HTTP proxy (fastest for web traffic)
# Configure these variables in qproxy.sh:
# HTTP_HOST="10.X.X.X"
# HTTP_PORT="3128"
http 	10.X.X.X 3128

# Secondary SOCKS5 proxy (better protocol support)
# Configure these variables in qproxy.sh:
# SOCKS5_HOST="10.X.X.X"
# SOCKS5_PORT="1080"
socks5 	10.X.X.X 1080

# RECOMMENDATIONS:
# 1. Add more proxies for better redundancy
# 2. Use different geographic locations for better anonymity
# 3. Test proxy performance regularly
# 4. Consider adding authentication if required
# 5. Monitor proxy uptime and performance
